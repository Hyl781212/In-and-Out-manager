<style>
/* 原有页面样式可写在这里 */
@media print {
  /* 清除浏览器打印页眉、页脚、页码、URL */
  @page {
    margin: 10mm;
    margin-top: 5mm;
    margin-bottom: 5mm;
    @top-center { content: ""; }
    @bottom-center { content: ""; }
  }
  /* 隐藏顶部按钮栏，打印不显示操作按钮 */

    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
            margin: 4px 0;
            font-size: 14px;
            font-family: "Microsoft Yahei", SimSun, sans-serif;
        }
        body {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            line-height: 1.8;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            text-align:center;
        }
        h2 {
            font-size: 18px;
            margin: 16px 0 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }
        h3 {
            font-size: 16px;
            margin: 12px 0 6px;
        }
        h4 {
            font-size: 15px;
            margin: 6px 0;
        }
        .row {
            margin: 8px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .item-group {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
        .item-gap1 {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        label {
            white-space: nowrap;
        }
        input[type="text"], input[type="date"], input[type="number"] {
            padding: 3px 6px;
            border: 1px solid #666;
        }
        input[maxlength="2"] { width: 40px; }
        input[maxlength="3"] { width: 50px; }
        input[maxlength="4"] { width: 60px; }
        input[maxlength="6"] { width: 80px; }
        input[maxlength="7"] { width: 90px; }
        input[maxlength="8"] { width: 110px; }
        input[maxlength="10"] { width: 130px; }
        input[maxlength="12"] { width: 160px; }
        input[maxlength="16"] { width: 190px; }
        input[maxlength="20"] { width: 240px; }
        input[maxlength="30"] { width: 320px; }
        input[maxlength="50"] { width: 480px; }
        .block {
            margin: 10px 0 20px;
            padding: 10px;
            border: 1px solid #999;
        }
        .contact-line {
            border: 1px dashed #aaa;
            padding: 8px;
            margin: 6px 0;
        }
        .btn-bar {
            margin: 10px 0 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 6px 14px;
            cursor: pointer;
            border: 1px solid #333;
            background: #f5f5f5;
            border-radius: 3px;
        }
        button:hover {
            background: #e8e8e8;
        }
        .required {
            color: red;
        }
        .bold-text {
            font-weight: bold;
        }
        /* 弹窗样式 */
        .mask {
            position: fixed;
            top:0;left:0;right:0;bottom:0;
            background: rgba(0,0,0,0.5);
            display:none;
            z-index:999;
        }
        .modal {
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            background:#fff;
            margin: 5vh auto;
            padding:20px;
            border-radius:6px;
        }
        .history-item {
            border:1px solid #ccc;
            padding:10px;
            margin:8px 0;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:10px;
        }
        .history-btn-group button {
            margin:0 4px;
        }
        #fileInput {
            display:none;
        }
        /* 打印样式 */
        @media print {
            .btn-bar, button, .mask { display: none !important; }
            .block { border: 0.5px solid #666; }
            .contact-line { border: 0.5px dashed #888; }
            body { padding: 0; }
        }
    
/* 统一所有单选选项行间距 */
.radio-group {
    line-height: 2.2; /* 控制每行高度，数值越大间距越宽 */
    margin: 8px 0;
}
.radio-group input[type="radio"] {
    margin-right: 6px;
    margin-left: 12px;
}
</style>

// ========== 收集表单全部数据 ==========
function collectFormData() {
    // 先获取所有基础数据
    const data = {};

    // 1. 收集所有普通input/select基础数据
    document.querySelectorAll('input[name], select[name]').forEach(el => {
        if (el.type === 'radio' || el.type === 'checkbox') {
            if (el.checked) {
                if (!data[el.name]) data[el.name] = [];
                data[el.name].push(el.value);
            }
        } else {
            data[el.name] = el.value;
        }
    });

    // 2. 供血史-首次全血强制收集
    data.firstWholeBloodTime = document.querySelector('input[name="firstWholeBloodTime"]')?.value || "";
    data.firstWholeBloodAddr = document.querySelector('input[name="firstWholeBloodAddr"]')?.value || "";
    data.firstWholeBloodUnit = document.querySelector('input[name="firstWholeBloodUnit"]')?.value || "";

    // 3. 3.3密接有无相关症状单选收集
    data.closeContactSymptom = document.querySelector('input[name="closeContactSymptom"]:checked')?.value || "";

    // 4. 青年学生9.2新增字段收集
    data.stuSchoolType = document.querySelector('select[name="stuSchoolType"]')?.value || "";
    data.stuSchoolOther = document.querySelector('input[name="stuSchoolOther"]')?.value || "";
    data.stuLiveTime = document.querySelector('select[name="stuLiveTime"]')?.value || "";
    data.stuSchoolStatus = document.querySelector('select[name="stuSchoolStatus"]')?.value || "";
    data.stuSchoolStatusOther = document.querySelector('input[name="stuSchoolStatusOther"]')?.value || "";

    // 5. 主表单姓名
    data.investigateeName = document.getElementById('investigateeName')?.value || "";

    // 6. 多条接触者批量收集数组
    const contactArr = [];
    document.querySelectorAll(".contact-line").forEach((block, idx) => {
        const i = idx;
        const contactObj = {
            contactType: block.querySelector(`input[name="contactType${i}"]:checked`)?.value || "",
            name: block.querySelector(`input[name="contactName${i}"]`)?.value || "",
            sex: block.querySelector(`input[name="contactSex${i}"]`)?.value || "",
            age: block.querySelector(`input[name="contactAge${i}"]`)?.value || "",
            tel: block.querySelector(`input[name="contactTel${i}"]`)?.value || "",
            social: block.querySelector(`input[name="contactSocial${i}"]`)?.value || "",
            addr: block.querySelector(`input[name="contactAddr${i}"]`)?.value || "",
            exposeAddr: block.querySelector(`input[name="contactExposeAddr${i}"]`)?.value || "",
            lastRisk: block.querySelector(`input[name="contactLastRisk${i}"]`)?.value || "",
            notifyType: block.querySelector(`input[name="notify${i}"]:checked`)?.value || "",
            notifyRemark: block.querySelector(`input[name="notifyRemark${i}"]`)?.value || "",
            trackResult: block.querySelector(`input[name="track${i}"]:checked`)?.value || "",
            trackCardId: block.querySelector(`input[name="trackCardId${i}"]`)?.value || ""
        };
        contactArr.push(contactObj);
    });
    data.contactList = contactArr;

    return data;
}

function clearAllForm() {
    if (!confirm("确定清空当前页面所有填写内容？操作不可恢复")) return;
    document.querySelectorAll('textarea').forEach(text=>text.value="");
    document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(input => {
        input.checked = false;
    });
    document.querySelectorAll('input[type="text"], input[type="number"], input[type="date"]').forEach(input => {
        input.value = "";
    });
    const contactBox = document.getElementById("contactBox");
    if (contactBox) contactBox.innerHTML = "";
    const countInput = document.getElementById("contactCount");
    if (countInput) countInput.value = "";
    const nameInput = document.getElementById('investigateeName');
    if(nameInput) nameInput.value = "";
    alert("已清空全部表单内容");
}

// ========== 导入CSV文件 ==========
function importCsvFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(){
        alert("导入完成，基础信息已回填，高危接触者请重新输入数字生成条目");
    }
    reader.readAsText(file);
    document.getElementById("fileInput").value = "";
}

// ========== 历史记录弹窗 ==========
function openHistoryModal() {
    const mask = document.getElementById("historyMask");
    const listWrap = document.getElementById("historyList");
    listWrap.innerHTML = "";
    let records = JSON.parse(localStorage.getItem("hiv_dc_records") || "[]");
    if (records.length === 0) {
        listWrap.innerHTML = "<p>暂无历史调查记录</p>";
    } else {
        records.forEach((rec, idx) => {
            const div = document.createElement("div");
            div.className = "history-item";
            const d = new Date(rec.createTime);
            div.innerHTML = `
                <div>记录${idx+1}｜被调查人：${rec.investigateeName || '未填写姓名'} — ${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}</div>
                <div class="history-btn-group">
                    <button class="edit-his" data-idx="${idx}">编辑填入表单</button>
                    <button class="del-his" data-idx="${idx}">删除本条</button>
                </div>
            `;
            listWrap.appendChild(div);
        });
        document.querySelectorAll(".edit-his").forEach(btn=>{
            btn.addEventListener("click", ()=>{
                fillFormData(records[Number(btn.dataset.idx)]);
                mask.style.display = "none";
            })
        })
        document.querySelectorAll(".del-his").forEach(btn=>{
            btn.addEventListener("click", ()=>{
                const i = Number(btn.dataset.idx);
                if (!confirm("确定删除这条记录，删除后无法恢复！")) return;
                records.splice(i, 1);
                localStorage.setItem("hiv_dc_records", JSON.stringify(records));
                openHistoryModal();
            })
        })
    }
    mask.style.display = "block";
}
function closeHistoryModal() {
    document.getElementById("historyMask").style.display = "none";
}

// ========== 回填历史数据到表单 ==========
function fillFormData(record) {
    document.querySelectorAll("input").forEach(i => {
        i.checked = false;
        if (i.type !== "radio" && i.type !== "checkbox") i.value = "";
    });
    document.getElementById("contactBox").innerHTML = "";
    const nameInput = document.getElementById('investigateeName');
    if(nameInput) nameInput.value = record.investigateeName || "";
    document.querySelectorAll('input[type="radio"]').forEach(rd => {
        if (record[rd.name] === rd.value) rd.checked = true;
    });
    const ckKeys = ["sexBehavior", "childHas", "bloodType", "halfYearAnal", "monthHetero", "symptomList"];
    ckKeys.forEach(key => {
        const arr = record[key] || [];
        document.querySelectorAll(`input[name="${key}"]`).forEach(cb => {
            cb.checked = arr.includes(cb.value);
        });
    });
    document.querySelectorAll('input[type="text"],input[type="date"],input[type="number"]').forEach(inp => {
        if (inp.name && record[inp.name] !== undefined) inp.value = record[inp.name];
    });
    document.querySelectorAll('select').forEach(sel => {
        if (sel.name && record[sel.name] !== undefined) sel.value = record[sel.name];
    });
    const cnt = Number(record.contactCount) || 0;
    document.getElementById("contactCount").value = cnt;
    createContactLine();
    const list = record.contactList || [];
    list.forEach((c, idx) => {
        const line = document.querySelectorAll(`.contact-line`)[idx];
        if (!line) return;
        line.querySelector(`input[name="contactName${idx}"]`).value = c.name;
        line.querySelector(`input[name="contactSex${idx}"]`).value = c.sex;
        line.querySelector(`input[name="contactAge${idx}"]`).value = c.age;
        line.querySelector(`input[name="contactTel${idx}"]`).value = c.tel;
        line.querySelector(`input[name="contactSocial${idx}"]`).value = c.social;
        line.querySelector(`input[name="contactAddr${idx}"]`).value = c.addr;
        line.querySelector(`input[name="contactExposeAddr${idx}"]`).value = c.exposeAddr;
        line.querySelector(`input[name="contactLastRisk${idx}"]`).value = c.lastRisk;
        line.querySelector(`input[name="notifyRemark${idx}"]`).value = c.notifyRemark;
        line.querySelector(`input[name="trackCardId${idx}"]`).value = c.trackCardId;
        line.querySelectorAll(`input[name="contactType${idx}"]`).forEach(r => r.checked = r.value === c.contactType);
        line.querySelectorAll(`input[name="notify${idx}"]`).forEach(r => r.checked = r.value === c.notifyType);
        line.querySelectorAll(`input[name="track${idx}"]`).forEach(r => r.checked = r.value === c.trackResult);
    });
}

// 姓名：输完失焦再脱敏，导出保留完整真实姓名
const nameInput = document.getElementById("investigateeName");

// 1. 打字时：实时把完整原始姓名存在输入框的自定义属性里（导出读这里）
nameInput.addEventListener("input", function() {
    this.dataset.realName = this.value;
});

// 2. 录入结束（失去焦点）：页面显示脱敏效果，只改视觉、不改真实值
nameInput.addEventListener("blur", function() {
    const fullName = this.dataset.realName || this.value;
    if (fullName.length >= 2) {
        const nameArr = Array.from(fullName);
        nameArr[1] = "*";
        this.value = nameArr.join("");
    }
});

// 3. 点击输入框恢复完整姓名方便修改
nameInput.addEventListener("focus", function() {
    this.value = this.dataset.realName || this.value;
    this.setSelectionRange(this.value.length, this.value.length);
});
